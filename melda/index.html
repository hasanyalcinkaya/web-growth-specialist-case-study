<style>
/* ============================================================
   DESIGN TOKENS — Untitled-UI style scales, Melda palette
   ============================================================ */
:root{
  --gray-25:#FCFCFD; --gray-50:#F9FAFB; --gray-100:#F2F4F7; --gray-200:#EAECF0; --gray-300:#D0D5DD;
  --gray-400:#98A2B3; --gray-500:#667085; --gray-600:#475467; --gray-700:#344054; --gray-800:#1D2939; --gray-900:#101828;
  --primary-25:#FAF9FF; --primary-50:#F3F1FF; --primary-100:#E8E4FF; --primary-200:#D3CBFF; --primary-300:#B4A6FF;
  --primary-400:#8E7BFB; --primary-500:#6E55F5; --primary-600:#5038ED; --primary-700:#4128D6; --primary-800:#3622AD; --primary-900:#2C1E8A; --primary-950:#1B1257;
  --pink-50:#FFF0F3; --pink-100:#FFE1E7; --pink-300:#F7A8B8; --pink-500:#EE5A78; --pink-700:#C2304F;
  --cyan-50:#EEFBFD; --cyan-100:#D9F5FA; --cyan-300:#8EDCEB; --cyan-500:#2FB3CE; --cyan-700:#13788E;
  --lav-50:#F5F2FF; --lav-100:#ECE7FF; --lav-300:#BBAEF7; --lav-500:#8B7CF6; --lav-700:#5B4BC4;
  --yel-50:#FFFAE6; --yel-100:#FFF2C2; --yel-300:#F7D56B; --yel-500:#EFB12F; --yel-700:#A26A08;
  --green-50:#ECFDF3; --green-100:#D1FADF; --green-500:#12B76A; --green-700:#027A48;
  --leaf:#5E8C78; --stem:#4F6B5E;
  --error-500:#F04438;
  --ph-menstrual:var(--pink-500); --ph-follicular:var(--cyan-500); --ph-ovulatory:var(--yel-500); --ph-luteal:var(--lav-500);
  --bg-top:#FFFCF3; --bg-mid:#FFFDF9; --bg-bottom:#F7F5FF;
  --grad:linear-gradient(135deg,#FFB38A 0%,#EE5A78 40%,#8B5CF6 75%,#5038ED 100%);
  --r-md:8px; --r-lg:10px; --r-xl:12px; --r-2xl:16px; --r-3xl:20px; --r-4xl:24px; --r-full:999px;
  --sh-xs:0 1px 2px rgba(16,24,40,.05);
  --sh-sm:0 1px 3px rgba(16,24,40,.10),0 1px 2px rgba(16,24,40,.06);
  --sh-md:0 4px 8px -2px rgba(16,24,40,.10),0 2px 4px -2px rgba(16,24,40,.06);
  --sh-lg:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);
  --sh-xl:0 20px 24px -4px rgba(16,24,40,.08),0 8px 8px -4px rgba(16,24,40,.03);
  --ring:0 0 0 4px var(--primary-100);
  --col:540px; --pad:20px; /* one fixed content column on every screen size */
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scrollbar-gutter:stable}
body{overflow-x:hidden}
body{font-family:var(--font);color:var(--gray-900);background:var(--bg-mid);
  background-image:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 45%,var(--bg-bottom) 100%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{display:block}
a{color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring)}

/* Type */
.display{font-size:30px;line-height:38px;letter-spacing:-.02em;font-weight:500}
.display b{font-weight:800}
.h2{font-size:24px;line-height:32px;letter-spacing:-.02em;font-weight:500}
.h2 b{font-weight:800}
.h3{font-size:18px;line-height:28px;font-weight:700}
.t-lg{font-size:18px;line-height:28px}.t-md{font-size:16px;line-height:24px}.t-sm{font-size:14px;line-height:20px}.t-xs{font-size:12px;line-height:18px}
.muted{color:var(--gray-600)}.subtle{color:var(--gray-500)}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Shell */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(255,252,243,.85);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.top-in{height:60px;max-width:var(--col);margin:0 auto;padding:0 var(--pad);display:grid;grid-template-columns:64px 1fr 64px;align-items:center}
.iconbtn{width:40px;height:40px;margin-left:-8px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--gray-900);background:none;border:0}
.iconbtn:hover{background:rgba(16,24,40,.05)}
.skipbtn{justify-self:end;margin-right:-8px;font-size:17px;font-weight:500;color:var(--gray-500);padding:8px}
.skipbtn:hover{color:var(--gray-800)}
.logo{justify-self:center;display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.03em}
.logo-mark{width:30px;height:30px;display:block;flex:none}
.step-meta{max-width:var(--col);margin:0 auto;padding:0 var(--pad) 12px;display:grid;gap:6px}
.step-meta .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--gray-500)}
.step-meta .lbl b{color:var(--primary-700)}
.prog{height:8px;border-radius:var(--r-full);background:var(--gray-200);overflow:hidden}
.prog i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--primary-500),var(--primary-600));transition:width .4s cubic-bezier(.2,.8,.2,1)}
.main{flex:1;width:100%;max-width:var(--col);margin:0 auto;padding:20px var(--pad) 32px}
.main.anim{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0}to{opacity:1}}
.foot{position:sticky;bottom:0;z-index:10;padding:16px var(--pad) calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(247,245,255,0),rgba(247,245,255,.96) 35%)}
.foot-in{max-width:calc(var(--col) - 2*var(--pad));margin:0 auto;display:grid;gap:8px}
.sitefoot{background:rgba(255,255,255,.55);border-top:1px solid var(--gray-200);padding:20px;text-align:center;font-size:13px;color:var(--gray-600);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center}
.sitefoot a{text-decoration:none}.sitefoot a:hover{text-decoration:underline}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 24px;border-radius:var(--r-full);font-weight:600;font-size:16px;transition:background .15s,box-shadow .15s,transform .1s;width:100%;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--primary-600);color:#fff;box-shadow:var(--sh-xs),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn-primary:hover{background:var(--primary-700)}
.btn-primary:disabled{background:var(--primary-200);box-shadow:none;cursor:not-allowed;transform:none}
.btn-secondary{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);box-shadow:var(--sh-xs)}
.btn-secondary:hover{background:var(--gray-50)}
.btn-link{height:auto;padding:10px;color:var(--gray-600);font-weight:600;font-size:15px;width:auto;justify-self:center}
.btn-link:hover{color:var(--gray-900)}
.btn-auto{width:auto;padding:0 32px}
.btn-soft{height:48px;background:rgba(255,255,255,.55);border:1px solid var(--gray-200);color:var(--gray-600);font-weight:600;font-size:15px}
.btn-soft:hover{background:#fff;color:var(--gray-800);border-color:var(--gray-300)}

/* Badges / chips */
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 10px;border-radius:var(--r-full);font-size:13px;font-weight:600;line-height:20px;background:#fff;border:1px solid var(--primary-200);color:var(--primary-700);box-shadow:var(--sh-xs)}
.badge.pink{background:var(--pink-50);border-color:var(--pink-300);color:var(--pink-700)}
.badge.cyan{background:var(--cyan-50);border-color:var(--cyan-300);color:var(--cyan-700)}
.badge.yel{background:var(--yel-50);border-color:var(--yel-300);color:var(--yel-700)}
.badge.lav{background:var(--lav-50);border-color:var(--lav-300);color:var(--lav-700)}
.badge.grad{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 16px -4px rgba(238,90,120,.5)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:var(--r-full);font-size:14px;font-weight:600;line-height:20px}
.chip.pink{background:var(--pink-100);color:var(--pink-700)}.chip.lav{background:var(--lav-100);color:var(--lav-700)}
.chip.cyan{background:var(--cyan-100);color:var(--cyan-700)}.chip.yel{background:var(--yel-100);color:var(--yel-700)}
.chip.solid{background:var(--primary-600);color:#fff}

/* Cards */
.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-3xl);box-shadow:var(--sh-sm);padding:20px}
.card.soft{background:rgba(255,255,255,.7);border-color:rgba(16,24,40,.06);box-shadow:none}
.stack{display:grid;gap:12px}.stack-lg{display:grid;gap:24px}
.center{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.emo{display:inline-block;width:1.2em;height:1.2em;vertical-align:-.25em;line-height:0;flex:none}
.emo svg{width:100%;height:100%;display:block}
.ic>.emo,.tic>.emo,.phase-dot>.emo,.sheet-ic>.emo{width:24px;height:24px;vertical-align:0}
.tile .tic>.emo{width:34px;height:34px}
.blob .big,.gift,.cat .e,.ng .big{line-height:0;display:block}
.blob .big .emo{width:80px;height:80px}
.gift .emo{width:128px;height:128px}
.cat .e .emo{width:26px;height:26px}
.ng .big .emo{width:44px;height:44px}
.trustcard .shield>.emo{width:26px;height:26px}
.sheet-ic>.emo{width:30px;height:30px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}

/* Question + list options */
.q-head{margin-bottom:24px}
.q-head .h2{margin-top:0}
.q-head p{margin-top:8px}
.q-head .badge{margin-bottom:12px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:60px;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-2xl);box-shadow:var(--sh-xs);transition:border-color .15s,background .15s,box-shadow .15s,transform .1s}
.opt:hover{border-color:var(--primary-300)}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--primary-600);background:var(--primary-25);box-shadow:0 0 0 3px var(--primary-100)}
.opt.quiet{min-height:52px;background:transparent;box-shadow:none;border-style:dashed}
.opt .ic{flex:none;width:40px;height:40px;border-radius:var(--r-xl);display:grid;place-items:center;font-size:20px;background:var(--lav-100)}
.opt .ol{flex:1;font-weight:600;font-size:16px;line-height:22px}
.opt .ol small{display:block;font-weight:400;font-size:14px;line-height:20px;color:var(--gray-500);margin-top:2px}
.ck{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--gray-300);background:#fff;display:grid;place-items:center;transition:.15s}
.ck.radio{border-radius:50%}
.on .ck{background:var(--primary-600);border-color:var(--primary-600)}
.on .ck::after{content:"";width:10px;height:6px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.on .ck.radio::after{width:8px;height:8px;border:0;border-radius:50%;background:#fff;transform:none}
.ic.pink{background:var(--pink-100)}.ic.cyan{background:var(--cyan-100)}.ic.yel{background:var(--yel-100)}.ic.lav{background:var(--lav-100)}

/* 2x2 tile options (age + goals) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:160px;padding:22px 14px;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-3xl);box-shadow:var(--sh-xs);text-align:center;transition:border-color .15s,box-shadow .15s,transform .12s}
.tile:hover{border-color:var(--primary-300);transform:translateY(-1px)}
.tile.on{border-color:var(--primary-600);background:var(--primary-25);box-shadow:0 0 0 3px var(--primary-100)}
.tile .tic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px}
.tile .tl{font-weight:600;font-size:15px;line-height:20px;color:var(--gray-900);min-height:40px;display:flex;align-items:center;justify-content:center}
.tile .ck{position:absolute;top:12px;right:12px}
.tile.age{padding:0;gap:0;overflow:hidden;justify-content:flex-start;min-height:0}
.tile.age .art{width:100%;height:118px;display:grid;place-items:end center;padding-top:8px}
.tile.age .tl{width:100%;min-height:0;padding:12px;background:var(--gray-50);border-top:1px solid var(--gray-100);font-size:18px;font-weight:700}
.tile.age.t-pink .art{background:linear-gradient(180deg,#fff,var(--pink-50))}
.tile.age.t-cyan .art{background:linear-gradient(180deg,#fff,var(--cyan-50))}
.tile.age.t-yel .art{background:linear-gradient(180deg,#fff,var(--yel-50))}
.tile.age.t-lav .art{background:linear-gradient(180deg,#fff,var(--lav-50))}

/* Notes / sheet */
.note{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:var(--r-xl);background:var(--cyan-50);border:1px solid var(--cyan-100);color:var(--cyan-700);font-size:14px;line-height:20px}
.note.lav{background:var(--lav-50);border-color:var(--lav-100);color:var(--lav-700)}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(16,24,40,.45);backdrop-filter:blur(3px);display:grid;align-items:end;justify-items:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:28px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:var(--sh-xl);animation:up .3s cubic-bezier(.2,.8,.2,1);text-align:center}
.sheet.pop{border-radius:24px;max-width:360px;margin:20px}
.scrim.mid{align-items:center}
@media(min-width:640px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-ic{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:30px;background:var(--lav-100)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Inputs */
.field{display:grid;gap:6px;text-align:left}
.field label{font-size:14px;font-weight:600;color:var(--gray-700)}
.input{height:52px;width:100%;padding:0 16px;border-radius:var(--r-xl);border:1px solid var(--gray-300);background:#fff;font-size:16px;box-shadow:var(--sh-xs);transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--gray-400)}
.input:focus{outline:none;border-color:var(--primary-300);box-shadow:var(--sh-xs),var(--ring)}
.input.lg{height:60px;font-size:20px;font-weight:600}
.input.fill{background:var(--gray-50);border-color:var(--gray-200)}
.checkrow{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:21px;color:var(--gray-700);cursor:pointer;text-align:left}
.checkrow input{appearance:none;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gray-300);background:#fff;margin-top:0;display:grid;place-items:center;cursor:pointer}
.checkrow input:checked{background:var(--green-500);border-color:var(--green-500)}
.checkrow input:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.checkrow.sq input{border-radius:6px}.checkrow.sq input:checked{background:var(--primary-600);border-color:var(--primary-600)}

/* Illustration helpers */
.illo{display:grid;place-items:center;margin:8px auto 20px}
.blob{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;position:relative}
.blob.lav{background:radial-gradient(circle at 30% 30%,#fff,var(--lav-100))}
.blob.pink{background:radial-gradient(circle at 30% 30%,#fff,var(--pink-100))}
.blob.cyan{background:radial-gradient(circle at 30% 30%,#fff,var(--cyan-100))}
.blob .big{font-size:72px;line-height:1}
.floaty{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.support .visual{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-3xl);box-shadow:var(--sh-md);padding:18px}
.support .rev{flex:none;margin-top:16px;text-align:left}
.support .rev p{margin-top:6px}
.uprow{display:flex;align-items:center;gap:12px;padding:12px 0}
.uprow+.uprow{border-top:1px solid var(--gray-100)}
.uprow .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.uprow b{display:block;font-size:15px}
.uprow span{font-size:13px;color:var(--gray-500)}
.uprow .when{margin-left:auto;font-size:13px;font-weight:700;color:var(--primary-700);white-space:nowrap}
.cat.dim{opacity:.4}
.wave-legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px;font-size:12px;color:var(--gray-600)}
.wave-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.weekcard{display:flex;gap:16px;align-items:center}
.weekcard .bigwk{flex:none;width:84px;height:84px;border-radius:24px;background:var(--grad);color:#fff;display:grid;place-content:center;text-align:center;line-height:1.05}
.weekcard .bigwk b{font-size:30px;font-weight:800}
.weekcard .bigwk small{font-size:11px;font-weight:700;opacity:.9}
.welcome{max-width:420px;margin:0 auto;padding-top:8px}
.privcard{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-3xl);box-shadow:var(--sh-md);padding:18px 20px}
.privhead{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--gray-100)}
.privhead .shield{flex:none;width:40px;height:40px;border-radius:12px;background:var(--green-50);display:grid;place-items:center}
.privhead .shield>.emo{width:22px;height:22px}
.privhead b{font-size:16px}
.privcard .ticks li{font-size:15px;color:var(--gray-700)}
.trustcard{display:flex;gap:14px;align-items:center;text-align:left;background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-3xl);box-shadow:var(--sh-md);padding:16px 18px}
.trustcard .shield{flex:none;width:52px;height:52px;border-radius:16px;background:var(--green-50);display:grid;place-items:center;font-size:26px}
.trustcard b{display:block;font-size:16px}
.trustcard ul{list-style:none;margin-top:4px;display:grid;gap:2px;font-size:13px;color:var(--gray-600)}

/* Calendar */
.cal{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-3xl);box-shadow:var(--sh-xs);padding:16px}
.cal h4{text-align:center;font-size:15px;margin:4px 0 10px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-grid .wd{font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase}
.cal-grid button{aspect-ratio:1;max-width:44px;width:100%;justify-self:center;border-radius:50%;font-size:14px;font-weight:600;border:1.5px solid var(--gray-200);color:var(--gray-800);position:relative}
.cal-grid button:hover:not(:disabled){border-color:var(--primary-300)}
.cal-grid button:disabled{border-color:transparent;color:var(--gray-300);cursor:default}
.cal-grid button.today::before{content:"TODAY";position:absolute;top:-11px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:800;letter-spacing:.04em;color:var(--gray-500)}
.cal-grid button.sel{background:var(--pink-500);border-color:var(--pink-500);color:#fff;box-shadow:0 0 0 3px var(--pink-100)}
.cal-sep{height:1px;background:var(--gray-100);margin:14px 0 6px}

/* Ring */
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ringwrap .center b{display:block;font-size:32px;line-height:38px;font-weight:800;letter-spacing:-.03em}
.phase-row{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:var(--r-2xl);background:#fff;border:1px solid var(--gray-200)}
.phase-dot{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px}
.phase-row b{font-size:15px}
.phase-row p{font-size:14px;line-height:20px;color:var(--gray-600);margin-top:2px}

/* Daily categories */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border-radius:var(--r-2xl);padding:14px;border:1px solid;text-align:left}
.cat .e{font-size:24px;line-height:1}
.cat b{display:block;margin-top:8px;font-size:15px}
.cat p{font-size:13px;line-height:18px;color:var(--gray-600);margin-top:2px}
.cat.move{background:var(--cyan-50);border-color:var(--cyan-100)}
.cat.eat{background:var(--yel-50);border-color:var(--yel-100)}
.cat.glow{background:var(--pink-50);border-color:var(--pink-100)}
.cat.focus{background:var(--lav-50);border-color:var(--lav-100)}

/* Chat */
.chat{background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-3xl);box-shadow:var(--sh-md);padding:16px;display:grid;gap:10px}
.chat-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--gray-100)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.bubble{max-width:85%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:20px}
.bubble.me{justify-self:end;background:var(--primary-600);color:#fff;border-bottom-right-radius:6px}
.bubble.ai{justify-self:start;background:var(--lav-50);color:var(--gray-800);border-bottom-left-radius:6px}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--lav-500);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.pill-opts{display:flex;flex-wrap:wrap;gap:10px}
.pill-opt{padding:12px 16px;border-radius:var(--r-full);background:#fff;border:1.5px solid var(--gray-200);font-weight:600;font-size:15px;box-shadow:var(--sh-xs);text-align:left}
.pill-opt.on{border-color:var(--primary-600);background:var(--primary-600);color:#fff}

/* Loading */
.bars{display:grid;gap:18px}
.bar-row .lab{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;color:var(--gray-500);margin-bottom:8px}
.bar-row.active .lab,.bar-row.done .lab{color:var(--gray-900);font-weight:700}
.bar-row .pct{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--gray-200)}
.bar-row.active .spin{border-color:var(--primary-100);border-top-color:var(--primary-600);animation:spin .8s linear infinite}
.bar-row.done .spin{border:0;background:var(--green-500);display:grid;place-items:center}
.bar-row.done .spin::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.track{height:8px;border-radius:var(--r-full);background:var(--primary-100);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--primary-600);border-radius:inherit}
.revs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -20px;padding-left:20px;padding-right:20px;scrollbar-width:none}
.revs::-webkit-scrollbar{display:none}
.rev{flex:0 0 84%;scroll-snap-align:center;background:#fff;border:1px solid var(--gray-200);border-radius:var(--r-3xl);padding:18px;box-shadow:var(--sh-xs);text-align:center}
.stars{color:#F5A524;letter-spacing:2px;font-size:18px}
.rev p{font-size:15px;line-height:22px;margin-top:8px}
.rev small{display:block;margin-top:8px;color:var(--gray-500);font-size:12px}
.sample-tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--yel-700);background:var(--yel-100);padding:2px 6px;border-radius:4px}

/* Celebration, gift, trial */
.celebrate{position:relative;width:200px;height:200px;margin:12px auto 24px;display:grid;place-items:center}
.celebrate .ringbg{position:absolute;inset:0;border-radius:50%;border:16px solid var(--lav-50)}
.celebrate .tick{width:96px;height:96px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 12px 30px -8px rgba(80,56,237,.5);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.confetti{position:absolute;inset:0;pointer-events:none}
.confetti i{position:absolute;width:10px;height:10px;border-radius:3px;animation:conf 1.2s ease-out both}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes conf{from{transform:translate(0,0) scale(.2);opacity:0}to{opacity:1}}
.gift{font-size:120px;line-height:1;animation:floaty 2.4s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(16,24,40,.12))}
.gift.shake{animation:shake .5s ease-in-out}
@keyframes shake{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.trialcard{width:170px;height:170px;margin:0 auto;border-radius:32px;background:var(--grad);color:#fff;display:grid;place-content:center;text-align:center;box-shadow:0 20px 50px -10px rgba(238,90,120,.55),0 0 0 10px rgba(255,255,255,.5);animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
.trialcard b{font-size:72px;line-height:72px;font-weight:800;letter-spacing:-.04em}
.trialcard span{font-size:17px;font-weight:700;line-height:22px}
.glow-bg{position:relative}
/* Trial upgrade 7 -> 30 animation */
.up-stage{position:relative;display:grid;place-items:center;height:230px}
.trialcard.nopop{animation:none}
.trialcard.counting{animation:grow .9s cubic-bezier(.3,.7,.3,1) forwards}
.trialcard.done{animation:land .55s cubic-bezier(.2,1.6,.4,1)}
.trialcard b{font-variant-numeric:tabular-nums;display:inline-block;min-width:2ch}
@keyframes grow{0%{transform:scale(1) rotate(0)}15%{transform:scale(.96) rotate(-3deg)}30%{transform:scale(1.02) rotate(3deg)}100%{transform:scale(1.14) rotate(0)}}
@keyframes land{from{transform:scale(1.2)}to{transform:scale(1)}}
.ring-pulse{position:absolute;width:170px;height:170px;border-radius:32px;border:3px solid var(--pink-300);opacity:0;pointer-events:none}
.burst .ring-pulse{animation:ringp .9s ease-out}
.burst .ring-pulse.r2{animation-delay:.15s;border-color:var(--lav-300)}
@keyframes ringp{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.9)}}
.spark{position:absolute;width:12px;height:12px;border-radius:3px;opacity:0;pointer-events:none}
.spark.star{width:16px;height:16px;border-radius:0;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.burst .spark{animation:spark .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes spark{0%{opacity:0;transform:translate(0,0) scale(.3) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(var(--r))}}
.plus23{position:absolute;top:6px;left:calc(50% + 46px);background:#fff;color:var(--primary-700);font-weight:800;font-size:15px;padding:5px 12px;border-radius:999px;box-shadow:var(--sh-md);opacity:0;white-space:nowrap}
.burst .plus23{animation:floatup 1.4s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(16px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.05)}40%{transform:scale(1)}100%{opacity:1;transform:translateY(-4px)}}
.reveal{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}
.draw{position:relative;white-space:nowrap}
.draw::after{content:"";position:absolute;left:-3px;right:-3px;top:55%;height:2.5px;border-radius:2px;background:var(--pink-500);transform:scaleX(0);transform-origin:left;transition:transform .45s ease .35s}
.in .draw::after{transform:scaleX(1)}
.new30{opacity:0;transition:opacity .35s ease .8s;color:var(--gray-900)}
.in .new30{opacity:1}
.glow-bg::before{content:"";position:absolute;left:50%;top:50%;width:320px;height:320px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(238,90,120,.18),rgba(139,92,246,.10) 45%,transparent 70%);z-index:-1}

/* Price choice */
.pricebox{background:var(--pink-50);border-radius:var(--r-3xl);padding:20px;margin:0 -4px}
.pchoice{display:flex;justify-content:space-between;align-items:center;padding:18px;background:#fff;border:1.5px solid var(--gray-200);border-radius:var(--r-2xl);font-size:20px;font-weight:700;box-shadow:var(--sh-xs)}
.pchoice.on{border-color:var(--primary-600);box-shadow:0 0 0 3px var(--primary-100)}

/* Paywall / checkout page */
.timerbar{position:sticky;top:0;z-index:25;background:var(--primary-950);color:#fff;padding:10px var(--pad)}
.timerbar-in{max-width:calc(var(--col) - 2*var(--pad));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;line-height:19px}
.tbox{display:flex;align-items:center;gap:4px;border:1.5px solid transparent;border-radius:12px;padding:4px 10px;background:linear-gradient(var(--primary-950),var(--primary-950)) padding-box,var(--grad) border-box;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbox b{font-size:20px;font-weight:800}.tbox small{font-size:10px;opacity:.7;margin-right:2px}
.saved{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--r-xl);background:var(--green-50);border:1px solid var(--green-100);font-size:14px;color:var(--gray-800)}
.saved>*:not(.t){min-width:0;overflow-wrap:anywhere}
.steps-list li>div{min-width:0;overflow-wrap:anywhere}
.saved .t{width:22px;height:22px;border-radius:50%;background:var(--green-500);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.ng{position:relative;display:grid;grid-template-columns:1fr 1fr;border-radius:var(--r-3xl);overflow:hidden;border:1px solid var(--gray-200);box-shadow:var(--sh-sm)}
.ng .side{padding:18px 14px 56px;min-height:220px;display:grid;align-content:start;gap:8px}
.ng .now{background:var(--gray-100);color:var(--gray-500)}
.ng .goal{background:linear-gradient(160deg,var(--lav-50),var(--pink-50))}
.ng .big{font-size:44px;line-height:1}
.ng .now .big{filter:grayscale(1);opacity:.55}
.ng .side p{font-size:13px;line-height:18px;font-weight:600}
.ng .goal p{color:var(--gray-800)}
.ng .mini{background:#fff;border-radius:12px;padding:8px 10px;font-size:12px;font-weight:600;box-shadow:var(--sh-xs);display:flex;gap:6px;align-items:center;color:var(--gray-800)}
.ng .switch{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;background:#fff;border-radius:14px;box-shadow:var(--sh-md);border:1px solid var(--gray-200);overflow:hidden;font-size:14px;font-weight:600}
.ng .switch span{padding:8px 18px;color:var(--gray-500);white-space:nowrap}
.ng .switch span+span{border-left:1px solid var(--gray-200);color:var(--primary-700)}
.today-card{border-radius:var(--r-3xl);overflow:hidden;border:1px solid var(--gray-200);background:linear-gradient(135deg,#fff,var(--lav-50));box-shadow:var(--sh-sm)}
.today-card .in{padding:18px}
.today-card .row{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.today-card .strip{background:var(--grad);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:10px;font-variant-numeric:tabular-nums}
.remind{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;border-radius:var(--r-2xl);background:var(--lav-50);border:1px solid var(--lav-100);font-weight:500;cursor:pointer}
.toggle{flex:none;width:48px;height:28px;border-radius:999px;background:var(--gray-300);position:relative;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:.2s}
.toggle.on{background:var(--primary-600)}.toggle.on::after{left:23px}
.plan{position:relative;display:block;width:100%;text-align:left;border-radius:var(--r-3xl);border:1.5px solid var(--gray-200);background:#fff;box-shadow:var(--sh-xs);transition:.15s;overflow:hidden}
.plan .head{display:none;background:var(--primary-600);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px}
.plan.on{border-color:var(--primary-600);box-shadow:0 0 0 3px var(--primary-100)}
.plan.on .head{display:block}
.plan .body{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px}
.plan:not(.on) .body{opacity:.55}
.plan .nm b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.plan .nm span{font-size:13px;color:var(--gray-500)}
.plan .nm .save{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:#fff;background:var(--green-500);border-radius:6px;padding:2px 8px}
.plan .pd{text-align:right}
.plan .pd b{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.plan .pd sup{font-size:16px;font-weight:800;vertical-align:top;position:relative;top:4px}
.plan .pd small{display:block;font-size:12px;color:var(--gray-500);margin-top:2px}
.fine{font-size:13px;line-height:20px;color:var(--gray-600);text-align:center}
.fine a{color:inherit}
.ticks{list-style:none;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:22px}
.ticks li::before{content:"✓";flex:none;width:22px;height:22px;border-radius:50%;background:var(--green-50);color:var(--green-700);font-size:12px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.mbg{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--gray-100);border-radius:var(--r-3xl);padding:18px}
.seal{width:76px;height:76px;border-radius:50%;background:var(--pink-500);color:#fff;display:grid;place-content:center;text-align:center;font-size:10px;font-weight:800;line-height:12px;letter-spacing:.04em;box-shadow:0 0 0 4px #fff,0 0 0 6px var(--pink-300)}
.seal b{font-size:20px;line-height:22px}
.info h4{font-size:16px;margin-top:16px}
.info p{font-size:14px;line-height:21px;color:var(--gray-600);margin-top:4px}
.secure-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px;font-size:12px;color:var(--gray-500)}
.secure-row .ssl{display:flex;align-items:center;gap:6px;font-weight:800;color:var(--gray-700);font-size:12px;letter-spacing:.02em}
.disclaimer{font-size:12px;line-height:18px;color:var(--gray-500);padding:14px;border-radius:var(--r-xl);background:rgba(255,255,255,.6);border:1px solid var(--gray-200)}

/* Payment */
.acc{border:1px solid var(--gray-200);border-radius:var(--r-3xl);background:#fff;overflow:hidden;box-shadow:var(--sh-xs)}
.acc-item+.acc-item{border-top:1px solid var(--gray-200)}
.acc-h{display:flex;align-items:center;gap:12px;width:100%;padding:18px;font-weight:700;font-size:17px;text-align:left}
.acc-h .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--gray-400);flex:none;display:grid;place-items:center}
.acc-item.on .rd{border-color:var(--gray-900)}
.acc-item.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--gray-900)}
.acc-h .logos{margin-left:auto;display:flex;gap:4px;align-items:center}
.acc-h .logos i{font-style:normal;font-size:9px;font-weight:800;border:1px solid var(--gray-200);border-radius:4px;padding:3px 5px;color:var(--gray-700)}
.acc-b{padding:0 18px 18px;display:grid;gap:12px}
.applepay{height:52px;border-radius:var(--r-xl);background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:18px;width:100%}
.ppbtn{height:52px;border-radius:var(--r-xl);background:#FFC439;color:#003087;font-weight:800;font-style:italic;font-size:18px;width:100%}
.lockin{position:relative}.lockin span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)}

/* Success */
.big-check{width:72px;height:72px;border-radius:50%;background:var(--green-50);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(18,183,106,.08);margin:0 auto}
.big-check i{width:48px;height:48px;border-radius:50%;background:var(--green-500);display:grid;place-items:center}
.steps-list{list-style:none;display:grid;gap:12px}
.steps-list li{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-2xl);background:#fff;border:1px solid var(--gray-200)}
.steps-list .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--primary-50);color:var(--primary-700);display:grid;place-items:center;font-weight:800;font-size:14px}
.stores{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.store{height:44px;padding:0 14px;border-radius:10px;background:#000;color:#fff;display:flex;align-items:center;gap:8px;font-size:11px;line-height:13px;text-align:left;text-decoration:none}
.store b{display:block;font-size:15px;line-height:17px}
.qr{display:none}
@media(min-width:960px){.qr{display:flex;gap:16px;align-items:center}}

/* Design notes (assumptions) */
body.notes [data-note]{position:relative;outline:2px dashed var(--yel-500);outline-offset:4px;border-radius:12px}
body.notes [data-note]::after{content:attr(data-note);position:absolute;top:-12px;right:8px;z-index:3;background:var(--yel-300);color:var(--gray-900);font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 8px;border-radius:6px;box-shadow:var(--sh-xs);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
body.notes span[data-note]{outline-offset:2px;border-radius:4px}
body.notes span[data-note]::after{position:static;display:inline-block;margin-left:6px;vertical-align:1px;max-width:none}
body:not(.notes) .note-only{display:none}

/* Screen navigator */
.nav-fab{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:40;width:28px;height:84px;border-radius:12px 0 0 12px;background:var(--gray-900);color:#fff;box-shadow:var(--sh-lg);display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.06em;writing-mode:vertical-rl;opacity:.55}
.nav-fab:hover{opacity:1}
@media(max-width:640px){.nav-fab{right:auto;left:0;top:12px;transform:none;width:12px;height:36px;border-radius:0 8px 8px 0;font-size:0;opacity:.35}}
.navpanel{position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.4);display:flex;justify-content:flex-end;animation:fade .15s}
.navpanel aside{width:min(360px,92vw);height:100%;background:#fff;box-shadow:var(--sh-xl);overflow:auto;padding:20px}
.navpanel h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gray-500);margin:18px 0 6px}
.navpanel a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r-md);color:var(--gray-700);text-decoration:none;font-size:14px;font-weight:500}
.navpanel a:hover{background:var(--gray-50)}
.navpanel a.cur{background:var(--primary-50);color:var(--primary-700);font-weight:600}
.navpanel a.off{opacity:.4}
.navpanel a i{font-style:normal;font-size:12px;color:var(--gray-400);width:20px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--gray-100);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:13px;font-weight:600;color:var(--gray-600)}
.seg button.on{background:#fff;color:var(--gray-900);box-shadow:var(--sh-xs)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.proto-banner{position:relative;z-index:70;background:#101828;color:#fff;font-size:12px;line-height:16px;text-align:center;padding:7px 36px 7px 12px}
.proto-banner b{color:#F7D56B}
</style>

/* Growing flower illustration for age tiles (stage 1–4) */
function flower(n){
  const petal='#F7C3B0', petal2='#F4A58C', leaf='var(--leaf)', stem='var(--stem)';
  const bloom=(x,y,r,open)=> open
    ? [0,72,144,216,288].map(a=>`<ellipse cx="${x+Math.cos(a*Math.PI/180)*r}" cy="${y+Math.sin(a*Math.PI/180)*r}" rx="${r*.75}" ry="${r*.55}" transform="rotate(${a} ${x+Math.cos(a*Math.PI/180)*r} ${y+Math.sin(a*Math.PI/180)*r})" fill="${petal}"/>`).join('')+`<circle cx="${x}" cy="${y}" r="${r*.45}" fill="${stem}"/>`
    : `<ellipse cx="${x}" cy="${y}" rx="${r*.55}" ry="${r*.85}" fill="${petal2}"/><path d="M${x-r*.5} ${y+r*.3} Q${x} ${y+r*1.2} ${x+r*.5} ${y+r*.3}" fill="${leaf}"/>`;
  const lf=(x,y,dir,s=1)=>`<path d="M${x} ${y} q ${14*dir*s} -10 ${30*dir*s} 0 q ${-14*dir*s} 10 ${-30*dir*s} 0z" fill="${leaf}"/>`;
  let g=`<path d="M60 108 L60 ${48-n*6}" stroke="${stem}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  g+=lf(60,92,1,1.1)+lf(60,92,-1,1.1);
  if(n>=2) g+=lf(60,74,1,.8)+lf(60,70,-1,.8);
  if(n===1) g+=bloom(60,40,8,false);
  if(n===2){ g+=`<path d="M60 52 L48 40 M60 52 L72 40" stroke="${stem}" stroke-width="2" stroke-linecap="round"/>`+bloom(60,34,8,false)+bloom(47,38,6,false)+bloom(73,38,6,false); }
  if(n===3){ g+=`<path d="M60 60 L36 44 M60 60 L84 44 M60 50 L60 30" stroke="${stem}" stroke-width="2" stroke-linecap="round"/>`+bloom(36,40,7,false)+bloom(84,40,7,false)+bloom(60,26,8,true)+lf(60,56,1,.6)+lf(60,56,-1,.6); }
  if(n===4){ g+=`<path d="M60 64 L30 40 M60 64 L90 40 M60 52 L44 24 M60 52 L76 24" stroke="${stem}" stroke-width="2" stroke-linecap="round"/>`+bloom(30,38,9,true)+bloom(90,38,9,true)+bloom(44,22,8,true)+bloom(76,22,8,true)+bloom(60,14,6,false); }
  return `<svg viewBox="0 0 120 110" width="120" height="110">${g}</svg>`;
}

function phaseOf(day,len){const ov=len-14;if(day<=5)return'menstrual';if(day<ov-1)return'follicular';if(day<=ov+1)return'ovulatory';return'luteal';}
function cycle(){
  const len=S.length||28; const known=!!S.lastDate && !S.lastUnknown;
  const ago= known ? Math.max(0,Math.round((TODAY-fromIso(S.lastDate))/864e5)) : 9;
  const day=(ago%len)+1;
  return {len,day,known,ph:phaseOf(day,len),next:addDays(TODAY,len-(ago%len))};
}
function ring(len,day,size=200,sw=18,marker=true){
  const r=(size-sw)/2,C=2*Math.PI*r,ov=len-14;
  const segs=[['menstrual',1,5],['follicular',6,ov-2],['ovulatory',ov-1,ov+1],['luteal',ov+2,len]];
  let arcs='';
  segs.forEach(([p,a,b])=>{const n=b-a+1;const L=(n/len)*C-4;const off=-((a-1)/len)*C;
    arcs+=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${PH[p].color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${Math.max(L,1)} ${C}" stroke-dashoffset="${off}"/>`;});
  let mk='';
  if(marker){const ang=((day-.5)/len)*2*Math.PI-Math.PI/2;const x=size/2+r*Math.cos(ang),y=size/2+r*Math.sin(ang);
    mk=`<circle cx="${x}" cy="${y}" r="${sw*.75}" fill="#fff" stroke="var(--gray-900)" stroke-width="3"/>`;}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g transform="rotate(-90 ${size/2} ${size/2})">${arcs}</g>${mk}</svg>`;
}

function waveSvg(){
  // illustrative energy curve across a 28-day cycle, phase-coloured bands
  const W=300,H=110, bands=[['menstrual',0,5],['follicular',5,12],['ovulatory',12,15],['luteal',15,28]];
  const x=d=>d/28*W, y=v=>H-12-v*(H-30);
  const pts=[...Array(29)].map((_,d)=>{const v=.35+.45*Math.sin((d-3)/28*Math.PI*2-Math.PI/2+Math.PI)*-1; return [x(d),y(Math.max(.08,Math.min(.95,.5+.4*Math.sin((d-6)/28*2*Math.PI))))];});
  const path='M'+pts.map(p=>p.map(n=>n.toFixed(1)).join(' ')).join(' L');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Example energy curve across a cycle">
    ${bands.map(([p,a,b])=>`<rect x="${x(a)}" y="0" width="${x(b)-x(a)}" height="${H}" fill="${PH[p].color}" opacity=".12"/>`).join('')}
    <path d="${path}" fill="none" stroke="var(--primary-600)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(10)}" cy="${y(.5+.4*Math.sin(4/28*2*Math.PI))}" r="5" fill="#fff" stroke="var(--primary-600)" stroke-width="3"/></svg>`;
}

    const months=[new Date(TODAY.getFullYear(),TODAY.getMonth()-1,1),new Date(TODAY.getFullYear(),TODAY.getMonth(),1)];
    const wd=['S','M','T','W','T','F','S'].map(d=>`<span class="wd">${d}</span>`).join('');
    const minD=addDays(TODAY,-55);
    const cal=months.map((m,mi)=>{ const days=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(); let cells='';
      for(let i=0;i<m.getDay();i++) cells+='<span></span>';
      for(let d=1;d<=days;d++){ const dt=new Date(m.getFullYear(),m.getMonth(),d); const v=iso(dt); const dis=dt>TODAY||dt<minD;
        cells+=`<button ${dis?'disabled':''} class="${v===iso(TODAY)?'today':''} ${S.lastDate===v?'sel':''}" data-act="date" data-v="${v}" aria-label="${dt.toDateString()}">${d}</button>`; }
      return `${mi?'<div class="cal-sep"></div>':''}<h4>${m.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h4><div class="cal-grid">${mi?'':wd}${cells}</div>`; }).join('');
    return `<div class="q-head"><h1 class="h2">When did your last period <b>start?</b></h1><p class="t-md muted">If you don’t remember the exact date, your best guess is fine.</p></div>
    <div class="cal">${cal}</div>`;
  },
  foot:()=>cta('Next',!!S.lastDate) },

{ id:'loading', title:'Personalising (3 bars + mini Qs)', stage:'Build', header:'brand', noBack:true,
  render(){
    const labels=['Analysing your answers','Mapping your cycle phases','Building your daily do’s & don’ts'];
    const revs=[['Finally an app that explains why I feel different every week.','Sample review'],['The daily tips are simple and actually fit my schedule.','Sample review'],['I like that I can just ask questions without feeling silly.','Sample review']];
    const mq = S.modal===1 ? ['Coffee or tea person?','mini1',[['coffee','Coffee ☕'],['tea','Tea 🍵']]]
             : S.modal===2 ? ['Do you have a sweet tooth?','mini2',[['yes','Yes 🍫'],['no','Not really']]] : null;
    return `<h1 class="h2 center" style="font-weight:700">Personalising <b>your plan</b>…</h1>
    <div class="trustcard mt24"><span class="shield">🔒</span><div><span class="t-xs subtle">Your data stays yours</span><b>Private by design. Never sold.</b></div></div>
    <div class="bars mt24">${labels.map((l,i)=>`<div class="bar-row" data-bar="${i}"><div class="lab"><span>${l}</span><span class="pct"><i class="spin"></i><span class="pv">0%</span></span></div><div class="track"><i></i></div></div>`).join('')}</div>
    <p class="t-sm center mt32" style="font-weight:600;color:var(--gray-600)">What people say about cycle syncing</p>
    <div class="revs mt12">${revs.map(([t,a])=>`<div class="rev"><div class="stars">★★★★★</div><p>${t}</p><small>— ${a}<span class="sample-tag">placeholder</span></small></div>`).join('')}</div>
    ${mq?`<div class="scrim mid"><div class="sheet pop" role="dialog" aria-modal="true" aria-labelledby="mq"><h2 class="h3" id="mq" style="font-size:22px;line-height:30px">${mq[0]}</h2>
      <div class="row2 mt24">${mq[2].map(([v,l])=>`<button class="btn btn-primary" data-act="mini" data-k="${mq[1]}" data-v="${v}">${l}</button>`).join('')}</div></div></div>`:''}`;
  },
  enter(){
    const rows=[...document.querySelectorAll('.bar-row')];
    const paint=()=>{ rows.forEach((r,i)=>{ const v=Math.max(0,Math.min(100,S.load-i*100)); r.querySelector('.pv').textContent=Math.round(v)+'%';
      r.querySelector('.track i').style.width=v+'%'; r.className='bar-row '+(v>=100?'done':v>0?'active':''); }); };
    paint();
    if(S.modal) return;
    timers.push(setInterval(()=>{
      if(S.load>=150 && S.mini1==null){ S.modal=1; render(); return; }
      if(S.load>=250 && S.mini2==null){ S.modal=2; render(); return; }
      S.load=Math.min(300,S.load+1.5); paint();
      if(S.load>=300){ clearTimers(); timers.push(setTimeout(()=>next(),500)); }
    },30));
  }},

    const showAll=()=>document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
    const reveal=()=>document.querySelectorAll('.reveal').forEach((el,i)=>timers.push(setTimeout(()=>el.classList.add('in'),i*220)));
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){ num.textContent='30'; showAll(); return; }
    timers.push(setTimeout(()=>{
      card.classList.remove('nopop'); card.classList.add('counting');
      const t0=performance.now();
      const iv=setInterval(()=>{
        const t=Math.min(1,(performance.now()-t0)/1000);
        num.textContent=Math.round(7+23*(1-Math.pow(1-t,3)));
        if(t>=1){ clearInterval(iv); num.textContent='30'; card.classList.remove('counting'); card.classList.add('done'); st.classList.add('burst'); timers.push(setTimeout(reveal,300)); }

const SCREENS_BY=Object.fromEntries(SCREENS.map(s=>[s.id,s]));

function downloadSteps(c){
  return `<ol class="steps-list mt24">
    <li><span class="n">1</span><div style="flex:1"><b>Download Melda</b><p class="t-sm muted">Free on iOS and Android.</p>
      <div class="stores"><a class="store" href="#">${apple(18,22)}<span>Download on the<b>App Store</b></span></a><a class="store" href="#"><span style="font-size:18px">▶</span><span>Get it on<b>Google Play</b></span></a></div>
      <div class="qr mt16">${qr()}<p class="t-sm muted">On a computer? Scan with your phone camera.</p></div></div></li>
    <li><span class="n">2</span><div><b>Log in with ${esc(S.email||'your email')}</b><p class="t-sm muted">We’ll send you a sign-in link. No password needed.</p></div></li>
    <li><span class="n">3</span><div><b>Start your Day ${c.day} plan</b><p class="t-sm muted">${PH[c.ph].e} ${PH[c.ph].name} phase. Today’s Move, Eat, Glow and Focus tips are ready${S.ask[0]?', and Melda has answered your first question':''}.</p></div></li>
  </ol>`;
}
function qr(){ let s=7,cells='';const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);
    if(f){const lx=x>13?x-14:x,ly=y>13?y-14:y;if(lx===0||lx===6||ly===0||ly===6||(lx>1&&lx<5&&ly>1&&ly<5))cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
    else if(rnd()>.52)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return `<svg width="96" height="96" viewBox="-1 -1 23 23" style="flex:none;background:#fff;border-radius:8px;border:1px solid var(--gray-200)" fill="var(--gray-900)">${cells}</svg>`; }

const PLANS={
  annual:{label:'Annual plan',sub:'$79.99 billed yearly',price:'79.99',every:'per year',perDay:79.99/365,head:'Best value',save:'Save 67%'},
  monthly:{label:'Monthly plan',sub:'$19.99 billed monthly',price:'19.99',every:'per month',perDay:19.99/30,head:'Most flexible'},
};
function startTimer(){
  if(!deadline) deadline=Date.now()+15*60*1000;
  const tick=()=>{const ms=Math.max(0,deadline-Date.now());const m=String(Math.floor(ms/60000)).padStart(2,'0'),s=String(Math.floor(ms/1000)%60).padStart(2,'0');
    document.querySelectorAll('[data-timer]').forEach(e=>e.textContent=`${m}:${s}`);
    const mm=document.getElementById('tm'),ss=document.getElementById('ts'); if(mm){mm.textContent=m;ss.textContent=s;}};
  tick(); timers.push(setInterval(tick,1000));
}

/* ============================================================
   ROUTER
   ============================================================ */
const app=document.getElementById('app');
let curId='age', navOpen=false, animateNext=true;
const visible=s=> !(s.adult&&minor()) && !(s.minorOnly&&!minor()) && (!s.show||s.show());
const quizList=()=>SCREENS.filter(s=>s.quiz&&visible(s));

function header(sc){
  const h=sc.header||'quiz';
  if(h==='none') return '';
  if(h==='timer') return `<div class="timerbar"><div class="timerbar-in"><span>⚡ Your trial upgrade is reserved for 15 minutes.</span><span class="tbox"><b id="tm">15</b><small>min</small><b>:</b><b id="ts">00</b><small>sec</small></span></div></div>
    ${sc.id==='payment'?`<header class="top"><div class="top-in"><button class="iconbtn" data-act="back" aria-label="Back">${chev}</button><div class="logo"><img class="logo-mark" src="${LOGO}" alt="">melda</div><span></span></div></header>`:''}`;
  const back = (h==='brand'||sc.noBack) ? '<span></span>' : `<button class="iconbtn" data-act="back" aria-label="Back">${chev}</button>`;
  const ql=quizList(), qi=ql.indexOf(sc);
  const skip = sc.quiz && sc.skip ? `<button class="skipbtn" data-act="skip">Skip</button>` : '<span></span>';
  return `<header class="top"><div class="top-in">${back}<div class="logo"><img class="logo-mark" src="${LOGO}" alt="">melda</div>${skip}</div>
    ${qi>=0?`<div class="step-meta"><div class="prog" role="progressbar" aria-valuenow="${qi+1}" aria-valuemax="${ql.length}"><i style="width:${((qi+1)/ql.length)*100}%"></i></div></div>`:''}</header>`;
}
function render(){
  clearTimers();
  const sc=SCREENS_BY[curId];
  const foot=sc.foot?sc.foot():'';
  app.innerHTML = header(sc) + `<main class="main ${animateNext?'anim':''}">${sc.render()}</main>` + (foot?`<div class="foot"><div class="foot-in">${foot}</div></div>`:'')
    + (sc.footer?`<footer class="sitefoot"><a href="#">Privacy Policy</a><span>·</span><a href="#">Terms of Use</a><span>·</span><a href="#">Accessibility</a><span style="flex-basis:100%">Melda is a wellness app, not a medical device.</span></footer>`:'')
    ;
  animateNext=false;
  document.title='Melda · '+sc.title;
  emojify(app);
  sc.enter&&sc.enter();
}
const EMO_RE=/\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?|[\u{1F3FB}-\u{1F3FF}])*/gu;
const emoCode=e=>{const c=[...e].map(x=>x.codePointAt(0).toString(16));return (e.includes('\u200D')?c:c.filter(x=>x!=='fe0f')).join('-');};
function emojify(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentNode;
    if(!p||p.closest('svg,script,style,textarea,input,.emo'))return NodeFilter.FILTER_REJECT;
    EMO_RE.lastIndex=0;return EMO_RE.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
  nodes.forEach(n=>{ EMO_RE.lastIndex=0; const html=esc(n.nodeValue).replace(EMO_RE,e=>{const svg=EMO[emoCode(e)];return svg?`<span class="emo" role="img" aria-label="">${svg}</span>`:e;});
    const t=document.createElement('template'); t.innerHTML=html; const parent=n.parentNode;
    // lone emoji in an icon box: drop surrounding whitespace so the icon is perfectly centred
    if(n.nodeValue.trim().length && t.content.childNodes.length===1 && t.content.firstChild.nodeType===1 && parent.childNodes.length===1){ parent.replaceChildren(t.content); return; }
    parent.replaceChild(t.content,n); });
}
function go(id,push=true){
  if(!SCREENS_BY[id]) id='age';
  if(push && curId!==id) hist.push(curId);
  if(id==='loading' && S.load>=300){ S.load=0; S.modal=null; }
  if(id==='gift') S.giftOpen=false;
  curId=id; animateNext=true; if(location.hash.slice(1)!==id) history.replaceState(null,'','#'+id);
  render(); window.scrollTo(0,0);
}
function next(){ const i=SCREENS.findIndex(s=>s.id===curId); for(let j=i+1;j<SCREENS.length;j++){ if(visible(SCREENS[j])) return go(SCREENS[j].id); } }
function back(){ const sc=SCREENS_BY[curId]; if(sc.back) return go(sc.back,false);
  let p; while((p=hist.pop())){ const s=SCREENS_BY[p]; if(p!=='loading' && visible(s) && p!==curId) return go(p,false); }
  go('age',false); }

function navFab(){
  const fab=`<button class="nav-fab" data-act="nav" aria-label="All screens">SCREENS</button>`;
  if(!navOpen) return fab;
  let html='',stage='';
  SCREENS.forEach((s,i)=>{ if(s.stage!==stage){stage=s.stage;html+=`<h4>${stage}</h4>`;}
    html+=`<a href="#${s.id}" class="${s.id===curId?'cur':''} ${visible(s)?'':'off'}" data-act="jump" data-v="${s.id}"><i>${String(i+1).padStart(2,'0')}</i>${s.title}${s.adult?' <span class="sample-tag" style="background:var(--lav-100);color:var(--lav-700)">18+</span>':''}${s.minorOnly?' <span class="sample-tag" style="background:var(--pink-100);color:var(--pink-700)">&lt;18</span>':''}</a>`; });
  return fab+`<div class="navpanel" data-act="navclose"><aside data-stop>
    <div style="display:flex;justify-content:space-between;align-items:center"><b>All screens (${SCREENS.length})</b><button class="iconbtn" data-act="navclose" aria-label="Close">✕</button></div>
    <p class="t-xs subtle mt8">Jump to any step. Missing answers fall back to defaults.</p>
    <p class="t-xs mt16" style="font-weight:600">Age branch</p><div class="seg mt8"><button class="${!minor()?'on':''}" data-act="branch" data-v="adult">18+</button><button class="${minor()?'on':''}" data-act="branch" data-v="u18">Under 18</button></div>
    <label class="checkrow sq mt16"><input type="checkbox" data-bind="__notes" ${document.body.classList.contains('notes')?'checked':''}><span>Show design notes (assumptions)</span></label>
    ${html}<button class="btn btn-secondary mt24" data-act="reset">Restart funnel</button></aside></div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
const valid=()=>{const sc=SCREENS_BY[curId];return !sc.valid||sc.valid();};
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  if(e.target.closest('[data-stop]') && (t.dataset.act==='navclose'||t.dataset.act==='sheetclose') && t.closest('[data-stop]')===null) return;
  if((t.dataset.act==='navclose'||t.dataset.act==='sheetclose') && e.target.closest('[data-stop]') && !e.target.closest('.iconbtn')) return;
  const {act,k,v}=t.dataset, sc=SCREENS_BY[curId];
  switch(act){
    case 'next': if(t.disabled) return; next(); break;
    case 'back': back(); break;
    case 'skip': next(); break;
    case 'age': { const was=S.age; S.age=v; if(was && (was==='u18')!==(v==='u18')) S.goals=[]; t.classList.add('on'); setTimeout(()=>go('goals'),200); break; }
    case 'pick': { S[k]=isNaN(+v)?v:+v; render(); break; }
    case 'toggle': { let a=[...(S[k]||[])]; const only=t.dataset.only;
      if(a.includes(v)) a=a.filter(x=>x!==v); else a = v===only ? [v] : a.filter(x=>x!==only).concat(v);
      S[k]=a; render(); break; }
    case 'consent': S.personalise=v; next(); break;
    case 'knowlast': S.knowLast=v; render(); break;
    case 'knownext': if(S.knowLast==='yes'){ S.lastUnknown=false; next(); } else { S.sheet=true; render(); } break;
    case 'guess': S.sheet=false; S.lastUnknown = v==='skip'; if(v==='skip') S.lastDate=''; next(); break;
    case 'sheetclose': S.sheet=false; render(); break;
    case 'date': S.lastDate=v; S.lastUnknown=false; render(); break;
    case 'mini': S[k]=v; S.modal=null; render(); break;
    case 'acceptall': S.priv1=S.priv2=true; render(); break;
    case 'opengift': { const g=document.getElementById('giftbox'); if(g){ g.classList.add('shake'); } setTimeout(()=>{ S.giftOpen=true; render(); },450); break; }
    case 'trial': S.trialPrice=v; render(); break;
    case 'plan': S.plan=v; render(); break;
    case 'remind': S.remind=!S.remind; render(); break;
    case 'topay': go('payment'); break;
    case 'paym': S.pay=v; render(); break;
    case 'paid': if(t.disabled) return; go('success'); break;
    case 'share': t.textContent='✓ Link copied'; break;
    case 'nav': navOpen=true; render(); break;
    case 'navclose': navOpen=false; render(); break;
    case 'branch': S.age = v==='u18'?'u18':(S.age&&S.age!=='u18'?S.age:'25-34'); S.goals=S.goals.filter(g=>goalList().includes(g)); if(!visible(SCREENS_BY[curId])) curId='age'; render(); break;
    case 'jump': e.preventDefault(); navOpen=false; if(!visible(SCREENS_BY[v])) S.age='25-34'; go(v); break;
    case 'reset': navOpen=false; S=FRESH(); deadline=null; hist=[]; go('age',false); break;
  }
});
app.addEventListener('input',e=>{
  const k=e.target.dataset.bind; if(!k) return;
  if(k==='__notes'){ document.body.classList.toggle('notes',e.target.checked); return; }
  let val=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(k==='card'){ val=val.replace(/\D/g,'').slice(0,16).replace(/(.{4})/g,'$1 ').trim(); e.target.value=val; }
  if(k==='exp'){ const d=val.replace(/\D/g,'').slice(0,4); val=d.length>2?d.slice(0,2)+' / '+d.slice(2):d; e.target.value=val; }
  if(k==='cvc'){ val=val.replace(/\D/g,'').slice(0,4); e.target.value=val; }
  S[k]=val;
  const b=document.querySelector('[data-cta]'); if(b && SCREENS_BY[curId].valid) b.disabled=!valid();
});
app.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.matches('input:not([type=checkbox])')){ const b=document.querySelector('[data-cta]'); if(b&&!b.disabled) b.click(); } });
window.addEventListener('popstate',()=>{ const id=location.hash.slice(1); if(id&&id!==curId) go(id,false); });

go(location.hash.slice(1)||'age',false);
